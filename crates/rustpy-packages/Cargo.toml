[package]
name = "rustpy-packages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RustPy IDE: pip integration (installed packages, install/uninstall with streamed output), PyPI lookups, requirements.txt analysis and OSV vulnerability checks"

[dependencies]
rustpy-core.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
pep508_rs = { version = "=0.9.2", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Proxy (Settings › HTTP Proxy) and certificate trust (Server Certificates).
rustpy-net.workspace = true
which.workspace = true
dirs.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
