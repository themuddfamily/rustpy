[package]
name = "rustpy-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RustPy IDE: database tools backend (SQLite data sources, schema introspection, queries, table editing, SQL helpers)"

[dependencies]
rustpy-core.workspace = true
rustpy-net.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
# Wide (UTF-16) ODBC calls: narrow calls are decoded in the process locale by
# drivers such as Microsoft's SQL Server driver, corrupting non-ASCII SQL text
# and results unless the process happens to run setlocale with UTF-8.
odbc-api = { version = "29.2", features = ["wide"] }
csv = "1.3"
url.workspace = true
redis = { version = "=1.7.1", default-features = false, features = ["tls-rustls"] }
mongodb = { version = "=3.9.1", default-features = false, features = ["sync", "compat-3-0-0", "rustls-tls", "redact-errors", "socks5-proxy"] }
# The driver's sync runtime calls Runtime::new(), gated by rt-multi-thread.
# mongodb 3.9's empty sync feature does not enable this Tokio requirement.
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile.workspace = true
