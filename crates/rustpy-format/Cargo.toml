[package]
name = "rustpy-format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RustPy IDE: Black / PEP 8 style Python code formatter"

[dependencies]
rustpy-core.workspace = true
rustpy-settings.workspace = true
rustpy-semantic.workspace = true
rustpy-syntax.workspace = true
rustpy-highlight.workspace = true
yaml-rust2.workspace = true
rustpy-text.workspace = true
similar.workspace = true
thiserror.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_IO"] }
