[package]
name = "rustpy-run"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RustPy IDE: process execution, consoles, coverage and profiling"

[dependencies]
dunce.workspace = true
rustpy-project.workspace = true
rustpy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
which.workspace = true
anyhow.workspace = true
regex.workspace = true
once_cell.workspace = true
portable-pty.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_Pipes", "Win32_Security"] }
