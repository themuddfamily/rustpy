[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/eframe", "vendor/egui_glow", "vendor/accesskit_atspi_common"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/themuddfamily/rustpy"
rust-version = "1.95"

[workspace.dependencies]
rustpy-core = { path = "crates/rustpy-core", version = "0.1.0" }
rustpy-text = { path = "crates/rustpy-text", version = "0.1.0" }
rustpy-syntax = { path = "crates/rustpy-syntax", version = "0.1.0" }
rustpy-highlight = { path = "crates/rustpy-highlight", version = "0.1.0" }
rustpy-settings = { path = "crates/rustpy-settings", version = "0.1.0" }
rustpy-semantic = { path = "crates/rustpy-semantic", version = "0.1.0" }
rustpy-project = { path = "crates/rustpy-project", version = "0.1.0" }
rustpy-analysis = { path = "crates/rustpy-analysis", version = "0.1.0" }
rustpy-refactor = { path = "crates/rustpy-refactor", version = "0.1.0" }
rustpy-run = { path = "crates/rustpy-run", version = "0.1.0" }
rustpy-terminal = { path = "crates/rustpy-terminal", version = "0.1.0" }
rustpy-vcs = { path = "crates/rustpy-vcs", version = "0.1.0" }
rustpy-search = { path = "crates/rustpy-search", version = "0.1.0" }
rustpy-debug = { path = "crates/rustpy-debug", version = "0.1.0" }
rustpy-templates = { path = "crates/rustpy-templates", version = "0.1.0" }
rustpy-test = { path = "crates/rustpy-test", version = "0.1.0" }
rustpy-format = { path = "crates/rustpy-format", version = "0.1.0" }
rustpy-packages = { path = "crates/rustpy-packages", version = "0.1.0" }
rustpy-updates = { path = "crates/rustpy-updates", version = "0.1.0" }
rustpy-http = { path = "crates/rustpy-http", version = "0.1.0" }
rustpy-db = { path = "crates/rustpy-db", version = "0.1.0" }
rustpy-regex = { path = "crates/rustpy-regex", version = "0.1.0" }
rustpy-console = { path = "crates/rustpy-console", version = "0.1.0" }
rustpy-i18n = { path = "crates/rustpy-i18n", version = "0.1.0" }
rustpy-plugins = { path = "crates/rustpy-plugins", version = "0.1.0" }
rustpy-grammar = { path = "crates/rustpy-grammar", version = "0.1.0" }
rustpy-docker = { path = "crates/rustpy-docker", version = "0.1.0" }
rustpy-ai = { path = "crates/rustpy-ai", version = "0.1.0" }
rustpy-emmet = { path = "crates/rustpy-emmet", version = "0.1.0" }
rustpy-notebook = { path = "crates/rustpy-notebook", version = "0.1.0" }
rustpy-deploy = { path = "crates/rustpy-deploy", version = "0.1.0" }
rustpy-gherkin = { path = "crates/rustpy-gherkin", version = "0.1.0" }
rustpy-spell = { path = "crates/rustpy-spell", version = "0.1.0" }
rustpy-textmate = { path = "crates/rustpy-textmate", version = "0.1.0" }
rustpy-index = { path = "crates/rustpy-index", version = "0.1.0" }
rustpy-net = { path = "crates/rustpy-net", version = "0.1.0" }
rustpy-secrets = { path = "crates/rustpy-secrets", version = "0.1.0" }
rustpy-cli = { path = "crates/rustpy-cli", version = "0.1.0" }
rustpy-ui = { path = "crates/rustpy-ui", version = "0.1.0" }
rustpy-lsp = { path = "crates/rustpy-lsp", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
yaml-rust2 = { version = "=0.13.0", default-features = false }
parking_lot = "0.12"
crossbeam-channel = "0.5"
ropey = "1.6"
rowan = "0.16"
smol_str = { version = "0.3", features = ["serde"] }
rustc-hash = "2"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
regex = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-ident = "1"
memchr = "2"
bitflags = "2"
dirs = "6"

pulldown-cmark = { version = "0.13", default-features = false }
notify = "8"
ignore = "0.4"
walkdir = "2"
which = "8"
portable-pty = "0.9"
vt100 = "0.16"
git2 = "0.21"
similar = "3"
chrono = "0.4"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence", "accesskit"] }
egui_extras = { version = "0.36", features = ["syntect"] }
# macOS only: the "open documents" Apple Event handler (rustpy-ui/src/macos_open.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL"] }
pretty_assertions = "1"
insta = "1"
tempfile = "3"
lsp-server = "0.10"
lsp-types = "0.97"
url = "2"
# rustpy-cli: pyproject.toml ([tool.black]) and the single-instance token and lock.
toml = "1"
getrandom = "0.3"
libc = "0.2"

[profile.dev]
opt-level = 1
# Line tables keep file:line backtraces while shrinking each test binary
# several-fold; full type info for every worktree's test binaries filled
# hundreds of GB of target/.
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 2
debug = false
# UI integration tests exercise behavior; avoid optimizing this large crate
# and retaining full type debug information on every semantic change.
[profile.test.package.rustpy-ui]
opt-level = 0
debug = "line-tables-only"
[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

# Native child webviews need the actual egui viewport window, including Float/Window tools.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui_glow = { path = "vendor/egui_glow" }
# Orca ignored re-shown widgets (editor tabs, focus after a dialog) as defunct.
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
