name: Release builds
# Manual Windows release workflow; other platform packaging is an explicit opt-in.
# Publishing a GitHub release and building the Flatpak/Snap packages are opt-in inputs.
# The Microsoft Store (MSIX) steps stay disabled until the package identity in
# packaging/windows/msix/identity.env is replaced with real Partner Center values.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Tag the commit and publish a GitHub release with the Windows assets
        type: boolean
        default: false
      sandbox_packages:
        description: Build Flatpak and Snap packages (needs preprovisioned runners)
        type: boolean
        default: false
      other_platforms:
        description: Build Linux and macOS packages (requires platform-specific native evidence)
        type: boolean
        default: false
      reuse_binary:
        description: Package a binary this workflow already built for this commit instead of compiling it again
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # Hosted runners have 4 vCPUs and run one job each: build on all of them.
  CARGO_BUILD_JOBS: '4'
  RAYON_NUM_THREADS: '4'
  RUST_TEST_THREADS: '2'
jobs:
  linux:
    if: ${{ inputs.other_platforms }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Fetch packaging source archives
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path qa/Cargo.toml
          cargo fetch --locked --manifest-path qa/fuzz/Cargo.toml
      - name: Native graphics and embedded WebKitGTK dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev unixodbc-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm dpkg-dev
      - run: cargo build --locked --release -p rustpy --target ${{ matrix.target }} --features native-web-preview
      - name: Linux archive and native packages
        env:
          RUSTPY_NO_BUILD: '1'
        run: |
          packaging/linux/build-tar.sh '${{ matrix.target }}'
          packaging/linux/build-appimage.sh --no-build --target '${{ matrix.target }}'
          packaging/linux/build-deb.sh --no-build --target '${{ matrix.target }}' -o target/debian
          packaging/linux/build-rpm.sh --no-build --target '${{ matrix.target }}'
      - name: Checksums
        run: python3 scripts/release-checksums.py target/dist target/appimage target/debian target/generate-rpm --output target/SHA256SUMS
  # Windows releases are built in two halves. build-binary compiles and links rustpy.exe,
  # records and verifies its link-time licence evidence and stages Native-Licenses.zip bound
  # to that exact executable; package turns those two files into the portable zip, Inno Setup
  # installer and MSI, then runs installation acceptance. With reuse_binary, a binary that this
  # workflow already built for the same commit and target is packaged without compiling again.
  binary-lookup:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      build: ${{ steps.find.outputs.build }}
      runs: ${{ steps.find.outputs.runs }}
    steps:
      - id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ inputs.reuse_binary }}
        run: |
          set -euo pipefail
          build='[]'
          runs='{}'
          for pair in windows-2025=x86_64-pc-windows-msvc windows-11-arm=aarch64-pc-windows-msvc; do
            runner=${pair%%=*}
            target=${pair#*=}
            run=''
            if [ "$REUSE" = true ]; then
              # Newest unexpired binary artifact of this commit that this workflow made.
              for candidate in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=rustpy-binary-$target-$GITHUB_SHA&per_page=30" \
                  --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_sha == env.GITHUB_SHA)] | sort_by(.created_at) | reverse | .[].workflow_run.id'); do
                if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate" --jq .path)" = .github/workflows/release.yml ]; then
                  run=$candidate
                  break
                fi
              done
            fi
            if [ -n "$run" ]; then
              echo "$target: packaging the binary built by run $run"
            else
              echo "$target: building the binary in this run"
              run=$GITHUB_RUN_ID
              build=$(jq -c --arg runner "$runner" --arg target "$target" '. + [{runner: $runner, target: $target}]' <<<"$build")
            fi
            runs=$(jq -c --arg target "$target" --arg run "$run" '. + {($target): $run}' <<<"$runs")
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
  build-binary:
    needs: binary-lookup
    if: ${{ needs.binary-lookup.outputs.build != '[]' }}
    timeout-minutes: 180
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      # Also the build script's default; stated here so the dependency cache key tracks it.
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.binary-lookup.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate native packaging scripts
        shell: pwsh
        run: |
          foreach ($path in @('scripts/build-windows-release.ps1', 'scripts/test-windows-packages.ps1')) {
            $parseErrors = $null
            $tokens = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          python -B -c "import runpy; runpy.run_path('scripts/prepare-windows-native-evidence.py', run_name='packaging_import_check')"
          if ($LASTEXITCODE) { throw 'Native evidence producer cannot load' }
          python -B -m unittest discover -s qa -p test_native_link_recording.py
          if ($LASTEXITCODE) { throw 'Native linker recorder checks failed' }
          $acceptance = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/test-windows-packages.ps1'), [ref]$tokens, [ref]$parseErrors)
          $renderer = $acceptance.Find({ param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Join-MsiArguments' }, $true)
          . ([scriptblock]::Create($renderer.Extent.Text))
          $actual = Join-MsiArguments @('/i', 'C:\build dirs\rustpy.msi', 'ALLUSERS=', 'INSTALLFOLDER=C:\install dirs\rustpy')
          if ($actual -cne '/i "C:\build dirs\rustpy.msi" ALLUSERS="" INSTALLFOLDER="C:\install dirs\rustpy"') { throw "Invalid MSI command rendering: $actual" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Registry archives and release-profile dependency artifacts. The release prefix keeps these
      # entries apart from ci.yml's. Only the default branch saves; other branches restore its
      # entry, so branch runs do not add gigabytes to the repository's 10 GB cache budget.
      # Workspace crates are not cached: a fresh checkout makes them stale for Cargo anyway.
      # cache-all-crates keeps the qa/ and qa/fuzz archives that the next step needs.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release
          shared-key: staticcrt-${{ matrix.target }}
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # The licence evidence reads the .crate archives of all three lockfiles. Runs after the cache
      # restore so that only archives missing from the cache are downloaded.
      - name: Fetch packaging source archives
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path qa/Cargo.toml
          cargo fetch --locked --manifest-path qa/fuzz/Cargo.toml
      - shell: pwsh
        run: scripts/build-windows-release.ps1 -Target '${{ matrix.target }}' -BuildOnly
      # The executable and the licence bundle bound to it, for this commit and target.
      - name: Retain the release binary
        uses: actions/upload-artifact@v7
        with:
          name: rustpy-binary-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/rustpy.exe
            target/windows/Native-Licenses.zip
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Retain native linkage evidence
        if: ${{ always() && env.RUSTPY_NATIVE_EVIDENCE_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-${{ matrix.target }}
          path: |
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/link-*.json
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/link-trace.txt
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/rustpy.map
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/toolchain.json
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/vs-instances.json
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/runtime/*.json
          retention-days: 7
          if-no-files-found: warn
  package:
    needs: [binary-lookup, build-binary]
    if: ${{ !cancelled() && needs.binary-lookup.result == 'success' && (needs.build-binary.result == 'success' || needs.build-binary.result == 'skipped') }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup 6 is required" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Restore WiX 5.0.2
        id: wix-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.dotnet/tools/wix.exe
            ~/.dotnet/tools/.store/wix
            ~/.wix/extensions
          key: wix-5.0.2-ui-5.0.2-${{ runner.os }}-${{ runner.arch }}
      # Provision the pinned WiX tool and matching UI extension explicitly; a restored copy is
      # used only when it reports exactly these versions.
      - name: WiX 5.0.2 and its UI extension (MSI feature selection)
        shell: pwsh
        run: |
          function Test-WixTools {
            $version = (& wix --version 2>$null) -join ''
            if ($LASTEXITCODE -or $version -notlike '5.0.2*') { return $false }
            $extensions = (& wix extension list -g 2>$null) -join "`n"
            return -not $LASTEXITCODE -and $extensions -match 'WixToolset\.UI\.wixext' -and $extensions -match '5\.0\.2'
          }
          if (Get-Command wix -ErrorAction SilentlyContinue) {
            if (Test-WixTools) { "Using cached WiX: $((& wix --version) -join '')"; exit 0 }
            dotnet tool uninstall --global wix
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $HOME '.wix/extensions')
          }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { throw "WiX installation failed" }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { throw "WiX UI extension installation failed" }
          if (-not (Test-WixTools)) { throw "WiX 5.0.2 with WixToolset.UI.wixext 5.0.2 is not usable" }
      - name: Save WiX 5.0.2
        if: steps.wix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.dotnet/tools/wix.exe
            ~/.dotnet/tools/.store/wix
            ~/.wix/extensions
          key: ${{ steps.wix-cache.outputs.cache-primary-key }}
      - name: Restore the release binary
        uses: actions/download-artifact@v8
        with:
          name: rustpy-binary-${{ matrix.target }}-${{ github.sha }}
          path: target
          run-id: ${{ fromJSON(needs.binary-lookup.outputs.runs)[matrix.target] }}
          github-token: ${{ github.token }}
      - shell: pwsh
        run: |
          scripts/build-windows-release.ps1 -Target '${{ matrix.target }}' -PackageOnly
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $arch = if ('${{ matrix.target }}' -like 'aarch64-*') { 'arm64' } else { 'x86_64' }
          $msiArch = if ($arch -eq 'arm64') { 'arm64' } else { 'x64' }
          foreach ($name in @("rustpy-$version-windows-$arch-portable.zip", "rustpy-$version-windows-$arch-setup.exe", "rustpy-$version-windows-$msiArch.msi")) {
            if (-not (Test-Path -LiteralPath "target/windows/$name")) { throw "Missing release asset: $name" }
          }
          Get-ChildItem target/windows -File | Where-Object Extension -in '.exe','.msi','.zip' | ForEach-Object { $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" } | Set-Content target/windows/SHA256SUMS
      # Acceptance only reads the packages, so it installs and removes them while they upload.
      # A hidden window keeps the background process off this step's output pipes.
      - name: Start native installation acceptance
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'rustpy-package-acceptance'
          $log = Join-Path $env:RUNNER_TEMP 'rustpy-package-acceptance.log'
          $acceptance = Join-Path $PWD 'scripts/test-windows-packages.ps1'
          $script = @"
          `$env:GITHUB_ENV = `$null
          try {
              & '$acceptance' -Target '${{ matrix.target }}' -ReportDir '$report' *>&1 | Out-File -LiteralPath '$log' -Encoding utf8
              Set-Content -LiteralPath '$log.status' -Value passed
          } catch {
              `$_ | Out-String | Out-File -LiteralPath '$log' -Append -Encoding utf8
              Set-Content -LiteralPath '$log.status' -Value failed
          }
          "@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $process = Start-Process pwsh -ArgumentList "-NoProfile -NonInteractive -EncodedCommand $encoded" -WindowStyle Hidden -PassThru
          "RUSTPY_ACCEPTANCE_PID=$($process.Id)" >> $env:GITHUB_ENV
          "RUSTPY_ACCEPTANCE_LOG=$log" >> $env:GITHUB_ENV
          "RUSTPY_PACKAGE_ACCEPTANCE_DIR=$report" >> $env:GITHUB_ENV
      # The packages are already compressed (and mostly the stored source bundle): do not deflate them again.
      - name: Retain candidate Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.target }}
          path: |
            target/windows/*-portable.zip
            target/windows/*-setup.exe
            target/windows/*.msi
          if-no-files-found: error
          compression-level: 0
      - name: Native installation acceptance
        shell: pwsh
        timeout-minutes: 30
        run: |
          $status = "$env:RUSTPY_ACCEPTANCE_LOG.status"
          while (-not (Test-Path -LiteralPath $status) -and (Get-Process -Id $env:RUSTPY_ACCEPTANCE_PID -ErrorAction SilentlyContinue)) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $env:RUSTPY_ACCEPTANCE_LOG) { Get-Content -LiteralPath $env:RUSTPY_ACCEPTANCE_LOG }
          if (-not (Test-Path -LiteralPath $status) -or (Get-Content -LiteralPath $status) -ne 'passed') {
            throw 'Native installation acceptance failed'
          }
      - name: Retain native installation acceptance
        if: ${{ always() && env.RUSTPY_PACKAGE_ACCEPTANCE_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-acceptance-${{ matrix.target }}
          path: ${{ env.RUSTPY_PACKAGE_ACCEPTANCE_DIR }}
          retention-days: 7
          if-no-files-found: error
      # Microsoft Store package: unsigned (the Store signs it), identity placeholders from
      # packaging/windows/msix/identity.env unless the RUSTPY_MSIX_* variables are set
      # from the Partner Center product identity. makeappx comes with the runner's SDK.
      - name: MSIX package (Microsoft Store)
        if: ${{ false }}
        shell: pwsh
        run: packaging/windows/build-msix.ps1 -Target '${{ matrix.target }}' -NoBuild
      - uses: actions/upload-artifact@v7
        if: ${{ false }}
        with:
          name: msix-${{ matrix.target }}
          path: target/msix/*.msix
          if-no-files-found: error
  msix-bundle:
    if: ${{ false }}
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: msix-*
          path: target/msix
          merge-multiple: true
      # x64 + arm64 in one .msixbundle, uploaded unsigned to Partner Center.
      - shell: pwsh
        run: packaging/windows/build-msix.ps1 -Bundle
      - uses: actions/upload-artifact@v7
        with:
          name: msixbundle
          path: target/msix/*.msixbundle
          if-no-files-found: error
  macos:
    if: ${{ inputs.other_platforms }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Fetch packaging source archives
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path qa/Cargo.toml
          cargo fetch --locked --manifest-path qa/fuzz/Cargo.toml
      - name: unixODBC
        run: |
          brew install unixodbc
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Universal bundle and DMG
        run: packaging/macos/build-app.sh --universal
      # Signing/notary credentials are injected only by an authorized release operator.
      - run: cd target/macos && shasum -a 256 *.dmg > SHA256SUMS
  sandbox-packages:
    if: ${{ inputs.sandbox_packages }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # flatpak-builder, snapcraft and the pinned SDK/runtime must be preprovisioned.
      - run: packaging/linux/flatpak/build-flatpak.sh --no-install --bundle
      - run: packaging/linux/build-snap.sh
  publish:
    if: ${{ inputs.publish }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: target/release-assets
          merge-multiple: true
      - name: Prepare version and checksums
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              print(f'RELEASE_TAG=v{version}', file=env)
          PYTHON
          python3 scripts/release-checksums.py target/release-assets --output target/release-assets/SHA256SUMS
          (cd target/release-assets && sha256sum --check SHA256SUMS)
      - name: Create tag and publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$RELEASE_TAG" > target/release-notes.md
          cat >> target/release-notes.md <<'NOTES'

          Windows x64 and ARM64 packages include portable ZIPs, setup executables and MSI installers. SHA256SUMS contains the download checksums.

          Automated Windows checks cover portable CLI startup, silent installation, reinstall, MSI repair and uninstallation on both architectures. These packages are unsigned. Interactive GUI and upgrades from an older release have not been validated. Linux, macOS and Microsoft Store packages are not included.
          NOTES
          bash scripts/publish-release.sh "$RELEASE_TAG" "$RELEASE_SHA" \
            target/release-assets target/release-notes.md
