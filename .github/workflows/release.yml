name: Release builds
# Manual Windows release workflow; other platform packaging is an explicit opt-in.
# Publishing a GitHub release and building the Flatpak/Snap packages are opt-in inputs.
# The Microsoft Store (MSIX) steps stay disabled until the package identity in
# packaging/windows/msix/identity.env is replaced with real Partner Center values.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Tag the commit and publish a GitHub release with the Windows assets
        type: boolean
        default: false
      sandbox_packages:
        description: Build Flatpak and Snap packages (needs preprovisioned runners)
        type: boolean
        default: false
      other_platforms:
        description: Build Linux and macOS packages (requires platform-specific native evidence)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  RAYON_NUM_THREADS: '2'
  RUST_TEST_THREADS: '2'
jobs:
  linux:
    if: ${{ inputs.other_platforms }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Fetch packaging source archives
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path qa/Cargo.toml
          cargo fetch --locked --manifest-path qa/fuzz/Cargo.toml
      - name: Native graphics and embedded WebKitGTK dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev unixodbc-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm dpkg-dev
      - run: cargo build --locked --release -p rustpy --target ${{ matrix.target }} --features native-web-preview
      - name: Linux archive and native packages
        env:
          RUSTPY_NO_BUILD: '1'
        run: |
          packaging/linux/build-tar.sh '${{ matrix.target }}'
          packaging/linux/build-appimage.sh --no-build --target '${{ matrix.target }}'
          packaging/linux/build-deb.sh --no-build --target '${{ matrix.target }}' -o target/debian
          packaging/linux/build-rpm.sh --no-build --target '${{ matrix.target }}'
      - name: Checksums
        run: python3 scripts/release-checksums.py target/dist target/appimage target/debian target/generate-rpm --output target/SHA256SUMS
  windows:
    timeout-minutes: 180
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate native packaging scripts
        shell: pwsh
        run: |
          foreach ($path in @('scripts/build-windows-release.ps1', 'scripts/test-windows-packages.ps1')) {
            $parseErrors = $null
            $tokens = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          python -B -c "import runpy; runpy.run_path('scripts/prepare-windows-native-evidence.py', run_name='packaging_import_check')"
          if ($LASTEXITCODE) { throw 'Native evidence producer cannot load' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Fetch packaging source archives
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path qa/Cargo.toml
          cargo fetch --locked --manifest-path qa/fuzz/Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-staticcrt-${{ matrix.target }}
          cache-on-failure: true
      - name: Check Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup 6 is required" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      # Provision the pinned WiX tool and matching UI extension explicitly.
      - name: WiX 5.0.2 and its UI extension (MSI feature selection)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { throw "WiX installation failed" }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { throw "WiX UI extension installation failed" }
      - shell: pwsh
        run: |
          scripts/build-windows-release.ps1 -Target '${{ matrix.target }}'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $arch = if ('${{ matrix.target }}' -like 'aarch64-*') { 'arm64' } else { 'x86_64' }
          $msiArch = if ($arch -eq 'arm64') { 'arm64' } else { 'x64' }
          foreach ($name in @("rustpy-$version-windows-$arch-portable.zip", "rustpy-$version-windows-$arch-setup.exe", "rustpy-$version-windows-$msiArch.msi")) {
            if (-not (Test-Path -LiteralPath "target/windows/$name")) { throw "Missing release asset: $name" }
          }
          Get-ChildItem target/windows -File | Where-Object Extension -in '.exe','.msi','.zip' | ForEach-Object { $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" } | Set-Content target/windows/SHA256SUMS
      - name: Native installation acceptance
        shell: pwsh
        run: scripts/test-windows-packages.ps1 -Target '${{ matrix.target }}'
      - name: Retain native linkage evidence
        if: ${{ always() && env.RUSTPY_NATIVE_EVIDENCE_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-${{ matrix.target }}
          path: |
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/link-*.json
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/link-trace.txt
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/rustpy.map
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/toolchain.json
            ${{ env.RUSTPY_NATIVE_EVIDENCE_DIR }}/runtime/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Retain native installation acceptance
        if: ${{ always() && env.RUSTPY_PACKAGE_ACCEPTANCE_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-acceptance-${{ matrix.target }}
          path: ${{ env.RUSTPY_PACKAGE_ACCEPTANCE_DIR }}
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.target }}
          path: |
            target/windows/*-portable.zip
            target/windows/*-setup.exe
            target/windows/*.msi
          if-no-files-found: error
      # Microsoft Store package: unsigned (the Store signs it), identity placeholders from
      # packaging/windows/msix/identity.env unless the RUSTPY_MSIX_* variables are set
      # from the Partner Center product identity. makeappx comes with the runner's SDK.
      - name: MSIX package (Microsoft Store)
        if: ${{ false }}
        shell: pwsh
        run: packaging/windows/build-msix.ps1 -Target '${{ matrix.target }}' -NoBuild
      - uses: actions/upload-artifact@v7
        if: ${{ false }}
        with:
          name: msix-${{ matrix.target }}
          path: target/msix/*.msix
          if-no-files-found: error
  msix-bundle:
    if: ${{ false }}
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: msix-*
          path: target/msix
          merge-multiple: true
      # x64 + arm64 in one .msixbundle, uploaded unsigned to Partner Center.
      - shell: pwsh
        run: packaging/windows/build-msix.ps1 -Bundle
      - uses: actions/upload-artifact@v7
        with:
          name: msixbundle
          path: target/msix/*.msixbundle
          if-no-files-found: error
  macos:
    if: ${{ inputs.other_platforms }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Fetch packaging source archives
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path qa/Cargo.toml
          cargo fetch --locked --manifest-path qa/fuzz/Cargo.toml
      - name: unixODBC
        run: |
          brew install unixodbc
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Universal bundle and DMG
        run: packaging/macos/build-app.sh --universal
      # Signing/notary credentials are injected only by an authorized release operator.
      - run: cd target/macos && shasum -a 256 *.dmg > SHA256SUMS
  sandbox-packages:
    if: ${{ inputs.sandbox_packages }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # flatpak-builder, snapcraft and the pinned SDK/runtime must be preprovisioned.
      - run: packaging/linux/flatpak/build-flatpak.sh --no-install --bundle
      - run: packaging/linux/build-snap.sh
  publish:
    if: ${{ inputs.publish }}
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: target/release-assets
          merge-multiple: true
      - name: Prepare version and checksums
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              print(f'RELEASE_TAG=v{version}', file=env)
          PYTHON
          python3 scripts/release-checksums.py target/release-assets --output target/release-assets/SHA256SUMS
          (cd target/release-assets && sha256sum --check SHA256SUMS)
      - name: Create tag and publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$RELEASE_TAG" > target/release-notes.md
          cat >> target/release-notes.md <<'NOTES'

          Windows x64 and ARM64 packages include portable ZIPs, setup executables and MSI installers. SHA256SUMS contains the download checksums.

          These packages are unsigned. Native GUI and install/upgrade/uninstall acceptance checks have not been completed for this release. Linux, macOS and Microsoft Store packages are not included.
          NOTES
          bash scripts/publish-release.sh "$RELEASE_TAG" "$RELEASE_SHA" \
            target/release-assets target/release-notes.md
