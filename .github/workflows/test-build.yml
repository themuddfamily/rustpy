name: Test build
# TEMPORARY (issues/abort only, restored before merge): stress the rustpy-ui library test
# binary on Windows with Windows Error Reporting crash dumps, to find a silent 0xC0000409.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: unused
        default: ''
      minutes:
        description: Stress minutes per leg
        default: '200'
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CI: 'true'
jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        leg: [c1, c2, c3, c4, c5, n1]
    runs-on: windows-2025
    timeout-minutes: 340
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-ui
          save-if: false
      - name: Windows long-name temporary directory
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Build test binary
        shell: pwsh
        run: |
          $pkgs = @('-p', 'rustpy-ui')
          foreach ($c in 'rustpy-ui-base', 'rustpy-ui-panels', 'rustpy-ui-db') { if (Test-Path "crates\$c") { $pkgs += @('-p', $c) } }
          $exe = cargo test --locked @pkgs --lib --no-run --message-format=json | ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.name -eq 'rustpy_ui' } | Select-Object -Last 1 -ExpandProperty executable
          if (-not $exe) { throw 'no test executable' }
          Write-Host "test executable: $exe"
          "TEST_EXE=$exe" >> $env:GITHUB_ENV
      - name: Enable crash dumps and probe them
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force $dumps | Out-Null
          "DUMPS=$dumps" >> $env:GITHUB_ENV
          Get-Service WerSvc | Format-List Name, Status, StartType
          Set-Service WerSvc -StartupType Manual -ErrorAction SilentlyContinue
          Start-Service WerSvc -ErrorAction SilentlyContinue
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-ItemProperty -Path $wer -Name Disabled -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $wer -Name DontShowUI -Value 1 -PropertyType DWord -Force | Out-Null
          foreach ($name in @('', (Split-Path $env:TEST_EXE -Leaf), 'abortprobe.exe')) {
            $key = if ($name) { "$wer\LocalDumps\$name" } else { "$wer\LocalDumps" }
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpCount -Value 50 -PropertyType DWord -Force | Out-Null
          }
          # A process that aborts the way Rust does (__fastfail), to show dumps are written.
          Set-Content "$env:RUNNER_TEMP\abortprobe.rs" 'fn main() { std::process::abort() }'
          rustc -o "$env:RUNNER_TEMP\abortprobe.exe" "$env:RUNNER_TEMP\abortprobe.rs"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\abortprobe.exe" -NoNewWindow -PassThru -Wait
          Write-Host ("probe exit code 0x{0:X8}" -f $p.ExitCode)
          Start-Sleep -Seconds 10
          Get-ChildItem $dumps | Format-Table Name, Length
          if (-not (Get-ChildItem $dumps -Filter 'abortprobe*')) { Write-Host '::warning::no crash dump for the probe' }
          Get-ChildItem $dumps -Filter 'abortprobe*' | Remove-Item
      - name: Stress
        shell: pwsh
        env:
          LEG: ${{ matrix.leg }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:TEST_EXE
          $deps = Split-Path $exe
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $sym = "$deps;srv*$($env:RUNNER_TEMP)\symcache*https://msdl.microsoft.com/download/symbols"
          $keep = Join-Path $env:RUNNER_TEMP 'keep'
          New-Item -ItemType Directory -Force $keep | Out-Null
          $env:CARGO_MANIFEST_DIR = (Resolve-Path crates\rustpy-ui).Path
          $env:RUST_TEST_THREADS = '4'
          $skip = 'app::analysis_jobs::typing_latency_tests::an_edit_cancels_the_obsolete_analysis_of_a_five_thousand_line_file_promptly'
          $argv = @('--test-threads=4', '--skip', $skip)
          if ($env:LEG -like 'n*') { $env:RUST_BACKTRACE = '1'; $argv += '--nocapture' }
          Push-Location $env:CARGO_MANIFEST_DIR
          $all = @(& $exe --list --format terse --skip $skip 2>$null | Where-Object { $_ -match ': test$' } | ForEach-Object { $_ -replace ': test$', '' })
          Pop-Location
          Write-Host "$($all.Count) tests"
          $deadline = (Get-Date).AddMinutes([int]$env:MINUTES)
          $failures = 0; $passes = 0; $aborts = 0; $hangs = 0; $i = 0
          while ((Get-Date) -lt $deadline) {
            $i++
            $out = Join-Path $env:RUNNER_TEMP "out-$i.txt"; $err = Join-Path $env:RUNNER_TEMP "err-$i.txt"
            $started = Get-Date
            $p = Start-Process -FilePath $exe -ArgumentList $argv -WorkingDirectory $env:CARGO_MANIFEST_DIR -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $null = $p.Handle
            if (-not $p.WaitForExit(900 * 1000)) {
              $hangs++
              Write-Host "::error::HANG in iteration $i (leg $($env:LEG))"
              if (Test-Path $cdb) { & $cdb -pv -p $p.Id -y $sym -c ".lines -e; ~; ~*kn 80; qd" | Out-File (Join-Path $keep "hang-$i-stacks.txt") }
              Stop-Process -Id $p.Id -Force
              Copy-Item $out, $err $keep
              Get-Content $out -Tail 300
              continue
            }
            $p.WaitForExit()
            $secs = [int]((Get-Date) - $started).TotalSeconds
            $code = $p.ExitCode
            if ($code -ne 0) {
              $failures++
              $hex = '0x{0:X8}' -f $code
              Write-Host "::warning::iteration $i exited $hex after $secs s (leg $($env:LEG))"
              Copy-Item $out, $err $keep
              Write-Host '--- stdout tail'; Get-Content $out -Tail 300
              Write-Host '--- stderr tail'; Get-Content $err -Tail 300
              if ($env:LEG -notlike 'n*') {
                $done = @{}
                foreach ($line in (Get-Content $out)) { if ($line -match '^test (\S+) \.\.\. ') { $done[$Matches[1]] = $true } }
                $last = -1
                for ($k = 0; $k -lt $all.Count; $k++) { if ($done.ContainsKey($all[$k])) { $last = $k } }
                Write-Host "--- unreported tests up to the last reported one (+8), in start order (last reported index $last of $($all.Count))"
                for ($k = 0; $k -lt [Math]::Min($all.Count, $last + 9); $k++) { if (-not $done.ContainsKey($all[$k])) { Write-Host "  in flight: $($all[$k])" } }
              }
              if ($code -eq -1073740791 -or $code -eq -1073741571 -or $code -eq -1073741819) {
                $aborts++
                Start-Sleep -Seconds 15
                Get-ChildItem $env:DUMPS | Format-Table Name, Length
                $dump = Get-ChildItem $env:DUMPS -Filter "*.$($p.Id).dmp" | Select-Object -First 1
                if ($dump) {
                  Write-Host "--- cdb analysis of $($dump.Name)"
                  & $cdb -z $dump.FullName -y $sym -c ".lines -e; .lastevent; .exr -1; !analyze -v; ~; ~*kn 100; q" | Tee-Object (Join-Path $keep "abort-$i-analysis.txt")
                  Move-Item $dump.FullName (Join-Path $keep $dump.Name)
                } else { Write-Host '::warning::no dump for the aborted process' }
              }
            } else { $passes++ }
            Write-Host "iteration $i exit $code in $secs s (passes $passes, failures $failures, aborts $aborts, hangs $hangs)"
            Remove-Item $out, $err -ErrorAction SilentlyContinue
          }
          "STRESS leg $($env:LEG) on $($env:GITHUB_SHA): $i iterations, $passes passing, $failures failing, $aborts aborts, $hangs hangs" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.leg }}
          path: ${{ runner.temp }}/keep
          retention-days: 7
          if-no-files-found: ignore
