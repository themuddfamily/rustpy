name: Test build
# TEMPORARY stress harness for the idle-repaint investigation (branch only; never merged).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: unused
        default: ''
      full:
        description: Full rustpy-ui lib suite iterations per leg (4 threads)
        default: '19'
      module:
        description: Idle-check iterations per leg
        default: '260'
      bin_run:
        description: Reuse the stress-bin artifact of this run instead of building
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: stress-${{ github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '4'
  CI: 'true'
jobs:
  build:
    if: inputs.bin_run == ''
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: idle-stress
          cache-on-failure: true
      - name: Build the rustpy-ui lib test binary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p rustpy-ui --lib --no-run 2>&1 | tee build.log
          exe=$(sed -n 's/.*Executable unittests src[\\/]lib.rs (\(.*\))/\1/p' build.log | tail -1)
          echo "binary: $exe"
          mkdir bin && cp "$exe" bin/rustpy_ui_tests.exe
      - uses: actions/upload-artifact@v7
        with:
          name: stress-bin
          path: bin
          retention-days: 2
  stress:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v8
        with:
          name: stress-bin
          path: bin
          run-id: ${{ inputs.bin_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Stress
        shell: bash
        env:
          FULL: ${{ inputs.full }}
          MODULE: ${{ inputs.module }}
        run: |
          set +e -u
          bin="$PWD/bin/rustpy_ui_tests.exe"
          cd crates/rustpy-ui
          skip=app::analysis_jobs::typing_latency_tests::an_edit_cancels_the_obsolete_analysis_of_a_five_thousand_line_file_promptly
          idle=app::idle_repaint_tests::an_idle_app_with_no_pending_work_waits_for_the_caret_blink
          failures=0
          idle_failures=0
          run() { # label iteration timeout args...
            local label=$1 i=$2 limit=$3; shift 3
            local start=$SECONDS
            timeout "$limit" "$bin" "$@" > "$RUNNER_TEMP/iter.log" 2>&1
            local rc=$?
            if [ $rc -ne 0 ]; then
              failures=$((failures+1))
              if grep -q "$idle .*FAILED\|'$idle'.*panicked" "$RUNNER_TEMP/iter.log"; then idle_failures=$((idle_failures+1)); fi
              echo "::error::$label iteration $i failed with exit code $rc after $((SECONDS-start))s"
              echo "===== last 200 lines of $label iteration $i ====="
              tail -n 200 "$RUNNER_TEMP/iter.log"
              echo "===== end of $label iteration $i ====="
              mkdir -p "$GITHUB_WORKSPACE/failure" && cp "$RUNNER_TEMP/iter.log" "$GITHUB_WORKSPACE/failure/$label-$i.log"
            else
              echo "$label $i ok in $((SECONDS-start))s ($(grep -h '^test result' "$RUNNER_TEMP/iter.log" | tail -1))"
            fi
          }
          for i in $(seq 1 "$MODULE"); do
            run idle "$i" 180 --exact "$idle"
          done
          for i in $(seq 1 "$FULL"); do
            run full "$i" 900 --test-threads=4 --skip "$skip"
          done
          echo "leg ${{ matrix.leg }}: $MODULE idle and $FULL full iterations, $failures failed ($idle_failures in the idle check)"
          [ "$failures" -eq 0 ]
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.leg }}
          path: failure
          if-no-files-found: ignore
