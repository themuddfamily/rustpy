name: CI
# TEMPORARY stress workflow for the corrupt-workspace close hang; restored before merge.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CI: 'true'
jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        mode: [single, module, full4, full2]
    runs-on: windows-2025
    timeout-minutes: 340
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: stress-ui
          cache-on-failure: true
      - name: Windows long-name temporary directory
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Debugger probe
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | ForEach-Object FullName
          Get-Command procdump -ErrorAction SilentlyContinue
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
      - name: Build test binary
        run: cargo test --locked -p rustpy-ui --lib --no-run
      - name: Stress
        shell: pwsh
        env:
          MODE: ${{ matrix.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem target\debug\deps\rustpy_ui-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          $deps = Split-Path $exe
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $env:CARGO_MANIFEST_DIR = (Resolve-Path crates\rustpy-ui).Path
          $env:RUSTPY_TEST_WATCHDOG_SECS = '90'
          $target = 'app::session_ui::workspace_persistence_tests::corrupt_workspace_is_reported_and_never_overwritten_by_actual_close'
          $skip = 'app::analysis_jobs::typing_latency_tests::an_edit_cancels_the_obsolete_analysis_of_a_five_thousand_line_file_promptly'
          switch ($env:MODE) {
            'single' { $max = 600; $timeout = 240; $argv = @($target, '--exact') }
            'module' { $max = 300; $timeout = 400; $argv = @('app::session_ui', 'app::project_dialogs', 'app::workspace_ui', '--test-threads=4') }
            'full4'  { $max = 40;  $timeout = 1800; $argv = @('--test-threads=4', '--skip', $skip) }
            'full2'  { $max = 40;  $timeout = 1800; $argv = @('--test-threads=2', '--skip', $skip) }
          }
          $deadline = (Get-Date).AddMinutes(250)
          $failures = 0; $passes = 0
          for ($i = 1; $i -le $max -and (Get-Date) -lt $deadline; $i++) {
            $out = Join-Path $env:RUNNER_TEMP "out-$i.txt"; $err = Join-Path $env:RUNNER_TEMP "err-$i.txt"
            $started = Get-Date
            $p = Start-Process -FilePath $exe -ArgumentList $argv -WorkingDirectory $env:CARGO_MANIFEST_DIR -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $null = $p.Handle
            if (-not $p.WaitForExit($timeout * 1000)) {
              Write-Host "::error::HANG in iteration $i (mode $env:MODE) after $timeout s"
              if (Test-Path $cdb) { & $cdb -pv -p $p.Id -y $deps -c ".lines -e; ~*kn 80; qd" }
              Get-Content $out -Tail 60; Get-Content $err -Tail 200
              Stop-Process -Id $p.Id -Force
              exit 1
            }
            $p.WaitForExit()
            $secs = [int]((Get-Date) - $started).TotalSeconds
            $stderr = Get-Content $err -Raw
            if ($p.ExitCode -ne 0) {
              $failures++
              Write-Host "::warning::iteration $i exited $($p.ExitCode) after $secs s"
              Select-String -Path $out -Pattern 'FAILED|panicked|failures:|test result' | Select-Object -First 40 | ForEach-Object Line
              if ($stderr -match 'exceeded') { Write-Host "::error::watchdog fired in iteration $i"; Get-Content $err -Tail 400; exit 1 }
              Get-Content $err -Tail 40
            } else { $passes++ }
            if ($i % 10 -eq 0 -or $env:MODE -like 'full*') { Write-Host "iteration $i done in $secs s (passes $passes, failures $failures)" }
            Remove-Item $out, $err -ErrorAction SilentlyContinue
          }
          Write-Host "mode ${env:MODE}: $passes passing iterations, $failures failing, no hang"
