name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Performance bounds are checked locally and in the performance stage, not on
  # shared hosted runners (see typing_latency_tests.rs).
  CI: 'true'
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Formatting is platform-independent; on Windows `cargo fmt --all` exceeds the
      # command-line length limit (os error 206) with this many crates.
      - run: cargo fmt --all -- --check
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          cache-on-failure: true
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev unixodbc-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
        # The UI crate is the largest compile; the rest of the workspace runs beside it.
        shard: [ui, rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      # Git for Windows defaults to core.autocrlf=true; fixtures must check out byte for byte.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.shard }}
          cache-on-failure: true
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev unixodbc-dev xvfb libgl1-mesa-dri libegl1 libxcursor1 libxrandr2 libxi6
      - name: macOS unixODBC and a real temporary directory
        if: runner.os == 'macOS'
        # The default TMPDIR (/var/folders/...) is a symlink to /private/var; tests
        # that compare canonical paths need a temporary directory that is not.
        run: |
          brew install unixodbc
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
          # The keyboard tests are written against the Windows/Linux keymap semantics.
          echo "RUSTPY_KEYMAP_PLATFORM=default" >> "$GITHUB_ENV"
      # The runner's TEMP uses an 8.3 short name (C:\Users\RUNNER~1\...), which never
      # compares equal to the long canonical path; RUNNER_TEMP is a plain long path.
      - name: Windows long-name temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # Interpreter/debugpy/pytest/coverage, fuzz/nightly and cargo-deny are
      # provisioned separately; this recipe never installs Python packages.
      - if: matrix.shard == 'ui'
        run: cargo test --locked -p rustpy-ui --no-fail-fast
      - if: matrix.shard == 'rest'
        run: cargo test --locked --workspace --exclude rustpy-ui --no-fail-fast
      # Temporary diagnostic for the macOS EPERM at process-group spawn.
      - if: ${{ always() && matrix.shard == 'rest' && runner.os == 'macOS' }}
        run: cargo test --locked -p rustpy-format --lib -- --ignored spawn_probe --nocapture
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build
          cache-on-failure: true
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev unixodbc-dev
      - name: macOS unixODBC
        if: runner.os == 'macOS'
        run: |
          brew install unixodbc
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - run: cargo build --locked -p rustpy --bin rustpy
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config qa/deny.toml
