name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RAYON_NUM_THREADS: '2'
  RUST_TEST_THREADS: '2'
  # Typing-frame bounds are checked locally and in the performance stage, not on
  # shared hosted runners. The strict cancellation bound runs separately below.
  CI: 'true'
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Formatting is platform-independent; on Windows `cargo fmt --all` exceeds the
      # command-line length limit (os error 206) with this many crates.
      - run: cargo fmt --all -- --check
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          cache-on-failure: true
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev unixodbc-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        # The UI crate is the largest compile; the rest of the workspace runs beside it.
        shard: [ui, rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      # Git for Windows defaults to core.autocrlf=true; fixtures must check out byte for byte.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.shard }}
          cache-on-failure: true
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev unixodbc-dev xvfb libgl1-mesa-dri libegl1 libxcursor1 libxrandr2 libxi6
      - name: macOS unixODBC and a real temporary directory
        if: runner.os == 'macOS'
        # The default TMPDIR (/var/folders/...) is a symlink to /private/var; tests
        # that compare canonical paths need a temporary directory that is not.
        run: |
          brew install unixodbc
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
          # The keyboard tests are written against the Windows/Linux keymap semantics.
          echo "RUSTPY_KEYMAP_PLATFORM=default" >> "$GITHUB_ENV"
      # fish for the terminal-profile end-to-end test (terminal_panel.rs).
      - name: Linux fish shell
        if: runner.os == 'Linux' && matrix.shard == 'ui'
        run: |
          sudo apt-get install -y --no-install-recommends fish
          echo "RUSTPY_TEST_REQUIRED_SHELLS=fish" >> "$GITHUB_ENV"
      - name: macOS fish shell
        if: runner.os == 'macOS' && matrix.shard == 'ui'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install fish
          echo "RUSTPY_TEST_REQUIRED_SHELLS=fish" >> "$GITHUB_ENV"
      # A WSL distribution for the WSL terminal profile in the same test.
      - name: Windows WSL distribution
        if: runner.os == 'Windows' && matrix.shard == 'ui'
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Alpine-3.22
          use-cache: false
      - name: Require the WSL profile
        if: runner.os == 'Windows' && matrix.shard == 'ui'
        shell: pwsh
        run: |
          wsl.exe --list --verbose
          "RUSTPY_TEST_REQUIRED_SHELLS=wsl" >> $env:GITHUB_ENV
      # Keychain trust settings for the macOS CA import check (system_store.rs).
      - name: macOS keychain trust settings
        if: runner.os == 'macOS' && matrix.shard == 'rest'
        run: python3 scripts/ci-macos-keychain-trust.py
      # The runner's TEMP uses an 8.3 short name (C:\Users\RUNNER~1\...), which never
      # compares equal to the long canonical path; RUNNER_TEMP is a plain long path.
      - name: Windows long-name temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # The framework run-action check against genuine Pyramid and web2py
      # (configured_legacy_tests.rs; it skips where these are not provided):
      # hash-pinned Pyramid in a private venv and web2py at a pinned commit.
      - name: Linux Pyramid and web2py for the framework run-action check
        if: runner.os == 'Linux' && matrix.shard == 'ui'
        env:
          WEB2PY_TAG: v3.4.1
          WEB2PY_COMMIT: f49922687c72c4c135d325333e40003f2c9aba08
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/legacy-frameworks"
          python3 -m venv "$base/venv"
          "$base/venv/bin/pip" install --quiet --require-hashes --only-binary=:all: -r qa/legacy-frameworks-requirements.txt
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$WEB2PY_TAG" \
            --recurse-submodules --shallow-submodules https://github.com/web2py/web2py "$base/web2py"
          test "$(git -C "$base/web2py" rev-parse HEAD)" = "$WEB2PY_COMMIT"
          git -C "$base/web2py" submodule status
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          {
            echo "RUSTPY_LEGACY_FRAMEWORKS_ADMITTED=1"
            echo "RUSTPY_LEGACY_FRAMEWORK_PYTHON=$base/venv/bin/python"
            echo "RUSTPY_LEGACY_FRAMEWORK_PYTHON_SHA256=$(sha "$base/venv/bin/python")"
            echo "RUSTPY_WEB2PY_FRAMEWORK=$base/web2py"
            echo "RUSTPY_WEB2PY_ENTRY=$base/web2py/web2py.py"
            echo "RUSTPY_WEB2PY_ENTRY_SHA256=$(sha "$base/web2py/web2py.py")"
            echo "RUSTPY_WEB2PY_MAIN=$base/web2py/gluon/main.py"
            echo "RUSTPY_WEB2PY_MAIN_SHA256=$(sha "$base/web2py/gluon/main.py")"
          } >> "$GITHUB_ENV"
      # Interpreter/debugpy/pytest/coverage, fuzz/nightly and cargo-deny are
      # provisioned separately; apart from the step above this recipe never
      # installs Python packages.
      - name: UI tests
        if: matrix.shard == 'ui'
        run: cargo test --locked -p rustpy-ui --no-fail-fast -- --test-threads=2 --skip app::analysis_jobs::typing_latency_tests::an_edit_cancels_the_obsolete_analysis_of_a_five_thousand_line_file_promptly
      - name: Cancellation latency (isolated)
        if: matrix.shard == 'ui'
        run: cargo test --locked -p rustpy-ui --lib app::analysis_jobs::typing_latency_tests::an_edit_cancels_the_obsolete_analysis_of_a_five_thousand_line_file_promptly -- --exact --test-threads=1
      - if: matrix.shard == 'rest'
        run: cargo test --locked --workspace --exclude rustpy-ui --no-fail-fast
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build
          cache-on-failure: true
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev unixodbc-dev
      - name: macOS unixODBC
        if: runner.os == 'macOS'
        run: |
          brew install unixodbc
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - run: cargo build --locked -p rustpy --bin rustpy
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config qa/deny.toml
